name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes to a branch or PR are cancelled; every main commit keeps its run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependency-audit:
    name: Rust dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Audit locked dependencies
        run: cargo audit

  release-checks:
    name: Workflows and container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Lint workflows and the action
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.10/scripts/download-actionlint.bash) 1.7.10
          ./actionlint -color
      - name: Check the release workflow patch is applied and stable
        run: |
          python3 scripts/patch-release-workflow.py
          git diff --exit-code .github/workflows/release.yml
      - name: Build the container image from source
        run: docker build --tag vee:ci .
      - name: Run the container image
        run: docker run --rm vee:ci --version

  web:
    name: Web assets and browser workflows (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Rebuild bundled UI assets
        working-directory: web
        run: npm run build
      - name: Check generated assets are current
        run: git diff --exit-code -- web/dist
      - name: Install Playwright browser
        working-directory: web
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright browser (macOS and Windows)
        working-directory: web
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Run browser workflows
        working-directory: web
        run: npm run test:e2e

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Python for mutation-effectiveness fixtures
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Java for mutation-effectiveness fixtures
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Go for mutation-effectiveness fixtures
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24.x'
      - name: Install gopls for Go impact acceptance
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/vee-tools
        run: |
          mkdir -p "$GOBIN"
          go install golang.org/x/tools/gopls@v0.18.1
          echo "$GOBIN" >> "$GITHUB_PATH"
          export PATH="$GOBIN:$PATH"
          gopls version
      - name: Install Node.js for mutation-effectiveness fixtures
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Ruby for mutation-effectiveness fixtures
        uses: ruby/setup-ruby@4e97ecde5048e1e0816923020652678063ffbf65 # v1.339.0
        with:
          ruby-version: '3.3'
      - name: Install TypeScript language service for impact acceptance
        shell: bash
        run: |
          npm install --global typescript@6.0.3
          echo "VEE_TSSERVER=$(npm root --global)/typescript/lib/tsserver.js" >> "$GITHUB_ENV"
          test -f "$(npm root --global)/typescript/lib/tsserver.js"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install rust-analyzer for Rust impact acceptance
        run: rustup component add rust-analyzer
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        # The language-service acceptance tests start bounded compiler servers
        # (gopls, rust-analyzer, and tsserver). Running tests concurrently can
        # starve those servers on smaller hosted runners and make semantic
        # impact results time out nondeterministically.
        # Fail, rather than skip, language-server fixtures whose server is missing.
        env:
          VEE_TEST_REQUIRE_LANGUAGE_SERVERS: '1'
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads=1
      - name: Verify project-aware TypeScript impact
        run: cargo test -p vee-application typescript_project_references_resolve_aliases_without_same_name_false_edges --locked
      - name: Install CLI from workspace
        run: cargo install --path crates/vee-cli --locked --force
      - name: Check installed CLI
        run: vee --version
      - name: Exercise installed CLI with local-only review
        run: python scripts/acceptance/installed_cli_smoke.py vee
      - name: Compare saved local-review reports
        run: python scripts/acceptance/compare_historical_reviews.py
      - name: Sign and verify a disposable release
        if: runner.os != 'Windows'
        run: python scripts/acceptance/release_signature.py
      - name: Check macOS notarization refusals
        if: runner.os != 'Windows'
        run: python scripts/acceptance/notarize_macos.py
      - name: Install acceptance script dependencies
        if: runner.os != 'Windows'
        run: python -m pip install -r scripts/acceptance/requirements.txt
      - name: Run local historical-review acceptance
        if: runner.os != 'Windows'
        run: python scripts/acceptance/historical_review_benchmark.py vee
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
