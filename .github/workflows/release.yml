name: Release

# A version tag builds and attests the binaries and opens a draft release.
# Publishing that draft is a maintainer's decision; it then publishes the
# container image for the same version.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, archive: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, archive: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-15-intel, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-14, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-2022, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Check the tag matches the workspace version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - name: Build
        run: cargo build --release --locked --bin vee --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="vee-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp README.md LICENSE "dist/${name}/"
          if [ "${{ matrix.archive }}" = zip ]; then
            cp "target/${{ matrix.target }}/release/vee.exe" "dist/${name}/"
            (cd dist && 7z a -tzip "${name}.zip" "${name}" >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/vee" "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi
      - name: Smoke test
        shell: bash
        run: |
          if [ "${{ matrix.archive }}" = zip ]; then exe=target/${{ matrix.target }}/release/vee.exe; else exe=target/${{ matrix.target }}/release/vee; fi
          "$exe" --version
      - uses: actions/upload-artifact@v4
        with:
          name: vee-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push'
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum vee-* > SHA256SUMS && cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/vee-*'
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}" --draft --verify-tag
          --title "Vee ${GITHUB_REF_NAME}" --generate-notes

  container:
    if: github.event_name == 'release'
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      # The image packages the release's own Linux binaries, so it holds exactly
      # what was attested, and nothing is compiled under emulation.
      - name: Fetch and verify the release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets dist/amd64 dist/arm64
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern "vee-$TAG-x86_64-unknown-linux-gnu.tar.gz" \
            --pattern "vee-$TAG-aarch64-unknown-linux-gnu.tar.gz" \
            --pattern SHA256SUMS
          (cd assets && sha256sum --check --ignore-missing SHA256SUMS)
          for archive in assets/*.tar.gz; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          done
          tar -xzf "assets/vee-$TAG-x86_64-unknown-linux-gnu.tar.gz" -C assets
          tar -xzf "assets/vee-$TAG-aarch64-unknown-linux-gnu.tar.gz" -C assets
          cp "assets/vee-$TAG-x86_64-unknown-linux-gnu/vee" dist/amd64/vee
          cp "assets/vee-$TAG-aarch64-unknown-linux-gnu/vee" dist/arm64/vee
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name and tags
        id: image
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$name:$TAG"
          # A prerelease does not become `latest`.
          if [ "$PRERELEASE" != "true" ]; then tags="$tags,$name:latest"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
      - name: Attest image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
