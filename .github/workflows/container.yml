name: Container image

# Called by the release workflow once a release is announced. It packages the
# release's own Linux binaries, after checking their checksums and provenance,
# so the image holds exactly what was attested and nothing is compiled under
# emulation.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  container:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      PRERELEASE: ${{ fromJson(inputs.plan).announcement_is_prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ fromJson(inputs.plan).announcement_tag }}
      - name: Fetch and verify the release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets dist/amd64 dist/arm64
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
              --pattern "vee-$target.tar.xz" --pattern "vee-$target.tar.xz.sha256"
            (cd assets && sha256sum --check "vee-$target.tar.xz.sha256")
            gh attestation verify "assets/vee-$target.tar.xz" --repo "$GITHUB_REPOSITORY"
            tar -xJf "assets/vee-$target.tar.xz" -C assets
          done
          cp assets/vee-x86_64-unknown-linux-gnu/vee dist/amd64/vee
          cp assets/vee-aarch64-unknown-linux-gnu/vee dist/arm64/vee
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name and tags
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$name:$TAG"
          # A prerelease does not become `latest`.
          if [ "$PRERELEASE" != "true" ]; then tags="$tags,$name:latest"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
      - name: Attest image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
