[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# The Homebrew formula goes to the organization's shared tap, which the org
# secret HOMEBREW_TAP_TOKEN can write to: brew install klarlabs-studio/tap/vee
tap = "klarlabs-studio/homebrew-tap"
# Publish the formula before the release is announced.
publish-jobs = ["homebrew"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Sign the macOS binaries with the Developer ID certificate in the CODESIGN_*
# secrets; scripts/notarize-macos.py then checks and notarizes them.
macos-sign = true
# Attest build provenance for every release artifact
github-attestations = true
# Publish the container image once the release is announced
post-announce-jobs = ["./container"]
# dist 0.34 renders the container job with a broken path ("$/") and without
# permissions, so the generated workflow is patched: after `dist generate`, run
# scripts/patch-release-workflow.py.
allow-dirty = ["ci"]

# The Linux binaries are built on Ubuntu 22.04 and need glibc 2.35; dist would
# otherwise accept 2.31, where they fail to start.
[dist.min-glibc-version]
x86_64-unknown-linux-gnu = "2.35"
aarch64-unknown-linux-gnu = "2.35"
