version: 1
review:
  include: ["crates/**/*.rs", "docs/**/*.md", "schemas/**/*.json", ".github/workflows/*.yml", ".vee.yaml", "Cargo.toml", "Cargo.lock", "README.md", "web/src/**/*.vue", "web/src/**/*.js", "web/src/**/*.css", "web/index.html", "web/package.json", "web/package-lock.json", "web/e2e/**/*.js", "web/playwright.config.js", "web/vite.config.js"]
  exclude: ["**/generated/**", "**/node_modules/**", "vendor/**", "web/dist/**", "target/**"]
  max_context_file_bytes: 1048576
  max_context_bytes: 600000
providers:
  codex:
    kind: codex_cli
    egress: network
    executable: codex
    env_allowlist: [PATH, HOME, CODEX_HOME]
reviewers:
  correctness:
    provider: codex
    instructions_file: .vee/reviewers/correctness.md
    include:
      - crates/vee-application/src/lib.rs
      - crates/vee-application/Cargo.toml
  correctness-core:
    provider: codex
    instructions_file: .vee/reviewers/correctness.md
    include:
      - crates/vee-core/src/lib.rs
  cli-contract:
    provider: codex
    instructions_file: .vee/reviewers/cli.md
    include:
      - crates/vee-cli/src/main.rs
  cli-surface:
    provider: codex
    instructions_file: .vee/reviewers/cli.md
    include:
      - README.md
      - crates/vee-cli/src/mcp.rs
      - schemas/gate-decision-v1.schema.json
      - schemas/review-output-v2.schema.json
  cli-acceptance:
    provider: codex
    instructions_file: .vee/reviewers/cli.md
    include:
      - crates/vee-cli/tests/cli.rs
  local-ui:
    provider: codex
    instructions_file: .vee/reviewers/ui.md
    include:
      - .gitignore
      - .vee.yaml
      - Cargo.toml
      - crates/vee-http/**
      - web/src/**
      - web/index.html
      - web/package.json
      - web/package-lock.json
      - web/e2e/**
      - web/playwright.config.js
      - web/vite.config.js
      - scripts/ui-smoke.py
  # Every other Rust source file. The reviewers above split the largest files so
  # each fits a provider's context; this one covers the rest (ADR 0010).
  correctness-crates:
    provider: codex
    instructions_file: .vee/reviewers/correctness.md
    include:
      - crates/**/*.rs
    exclude:
      - crates/vee-application/src/lib.rs
      - crates/vee-core/src/lib.rs
      - crates/vee-cli/src/main.rs
      - crates/vee-cli/src/mcp.rs
      - crates/vee-cli/tests/cli.rs
      - crates/vee-http/**
  # Output contracts and project files the code reviewers do not receive.
  contracts:
    provider: codex
    instructions_file: .vee/reviewers/cli.md
    include:
      - docs/**/*.md
      - schemas/**/*.json
      - .github/workflows/*.yml
      - Cargo.lock
      - crates/*/Cargo.toml
    exclude:
      - schemas/gate-decision-v1.schema.json
      - schemas/review-output-v2.schema.json
verification:
  # nox security scan (secrets, code, dependencies, IaC), offline. Error-level
  # results on changed lines block; pre-existing results never do. See ADR 0002.
  # Needs nox 1.69 or later for `--output -` (SARIF on stdout, no report files);
  # an older nox writes no SARIF to stdout, which leaves the gate incomplete.
  security:
    executable: nox
    args: [scan, ., --format, sarif, --output, "-", --offline, --tracked-only, --quiet]
    egress: local
    env_allowlist: [PATH, HOME, TMPDIR]
    timeout_seconds: 300
    output_limit_bytes: 8388608
    sarif:
      block_levels: [error]
policy:
  required_reviewers: [correctness, correctness-core, cli-contract, cli-surface, cli-acceptance, local-ui, correctness-crates, contracts]
  required_verifications: [security]
  block_severities: [critical, high]
  minimum_confidence: 80
  on_incomplete: block
