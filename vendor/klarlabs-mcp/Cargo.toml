[dependencies.arc-swap]
version = "1"

[dependencies.axum]
version = "0.8"
features = [
    "http1",
    "tokio",
]
optional = true
default-features = false

[dependencies.base64]
version = "0.22.1"

[dependencies.bytes]
version = "1"
optional = true

[dependencies.futures-util]
version = "0.3"
features = [
    "std",
    "async-await",
]
default-features = false

[dependencies.jsonschema]
version = "0.59"
default-features = false

[dependencies.mcp-protocol]
version = "0.1.0"
features = [
    "server",
    "schemars",
]
default-features = false
package = "klarlabs-mcp-protocol"

[dependencies.prost]
version = "0.14"
optional = true

[dependencies.regex]
version = "1"

[dependencies.reqwest]
version = "0.13"
features = [
    "json",
    "stream",
]
optional = true
default-features = false

[dependencies.schemars]
version = "1"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.sha2]
version = "0.10.9"
optional = true

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = [
    "rt",
    "macros",
    "time",
    "sync",
]

[dependencies.tokio-rustls]
version = "0.26"
features = [
    "aws_lc_rs",
    "tls12",
]
optional = true
default-features = false

[dependencies.tokio-stream]
version = "0.1"
features = ["net"]
optional = true

[dependencies.tokio-tungstenite]
version = "0.28"
features = ["rustls-tls-webpki-roots"]
optional = true

[dependencies.tokio-util]
version = "0.7"

[dependencies.tonic]
version = "0.14"
features = ["transport"]
optional = true

[dependencies.tonic-prost]
version = "0.14"
optional = true

[dependencies.tracing]
version = "0.1"

[dev-dependencies.mcp-protocol]
version = "0.1.0"
features = [
    "client",
    "transport-async-rw",
]
default-features = false
package = "klarlabs-mcp-protocol"

[dev-dependencies.reqwest]
