[package]
edition = "2024"
rust-version = "1.89"
name = "klarlabs-mcp"
version = "0.1.0"
build = false
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "UPSTREAM.md",
    "src/**",
    "examples/**",
    "tests/**",
    "proto/**",
]
publish = ["crates-io"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Typed MCP application framework ported from klarlabs-studio/mcp-go"
homepage = "https://klarlabs-studio.github.io/mcp-rs/"
readme = "README.md"
keywords = [
    "mcp",
    "model-context",
    "json-rpc",
    "ai",
    "async",
]
categories = [
    "api-bindings",
    "asynchronous",
]
license = "MIT"
repository = "https://github.com/klarlabs-studio/mcp-rs"

[features]
client = ["mcp-protocol/client"]
client-go-mrtr = [
    "client",
    "dep:reqwest",
]
client-go-subscriptions = [
    "client",
    "dep:reqwest",
    "dep:bytes",
]
client-http = [
    "client",
    "mcp-protocol/transport-streamable-http-client-reqwest",
    "mcp-protocol/reqwest",
]
client-stdio = [
    "client",
    "mcp-protocol/transport-child-process",
]
default = [
    "stdio",
    "http",
    "client",
]
elicitation = ["mcp-protocol/elicitation"]
grpc = [
    "dep:tonic",
    "dep:tonic-prost",
    "dep:prost",
    "dep:tokio-stream",
    "tokio/net",
    "tokio-util/rt",
]
grpc-tls = [
    "grpc",
    "tonic/tls-aws-lc",
]
http = [
    "dep:sha2",
    "dep:axum",
    "mcp-protocol/transport-streamable-http-server",
    "tokio/net",
]
stdio = ["mcp-protocol/transport-io"]
webhooks = [
    "dep:reqwest",
    "reqwest/rustls",
]
websocket = [
    "dep:tokio-tungstenite",
    "tokio/net",
    "futures-util/sink",
]
websocket-tls = [
    "websocket",
    "dep:tokio-rustls",
]

[lib]
name = "mcp_rs"
path = "src/lib.rs"

