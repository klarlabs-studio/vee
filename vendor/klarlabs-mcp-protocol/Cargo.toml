[package]
edition = "2024"
rust-version = "1.89"
name = "klarlabs-mcp-protocol"
version = "0.1.0"
build = false
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "UPSTREAM.md",
    "UPSTREAM-LICENSE",
    "src/**",
    "tests/**",
]
publish = ["crates-io"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Modern MCP protocol engine maintained by Klarlabs for mcp-rs"
homepage = "https://klarlabs-studio.github.io/mcp-rs/"
readme = "README.md"
keywords = [
    "mcp",
    "model-context",
    "json-rpc",
    "async",
]
categories = [
    "api-bindings",
    "asynchronous",
]
license = "Apache-2.0 AND MIT"
repository = "https://github.com/klarlabs-studio/mcp-rs"

[features]
__reqwest = ["dep:reqwest"]
client = ["dep:tokio-stream"]
client-side-sse = [
    "dep:sse-stream",
    "dep:http",
    "dep:bytes",
    "base64",
]
default = []
elicitation = ["dep:url"]
reqwest = [
    "__reqwest",
    "reqwest?/rustls",
]
schemars = ["dep:schemars"]
server = [
    "transport-async-rw",
    "schemars",
    "dep:pastey",
    "uuid",
]
server-side-http = [
    "uuid",
    "dep:rand",
    "dep:tokio-stream",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:bytes",
    "dep:sse-stream",
    "tower",
    "base64",
]
tower = ["dep:tower-service"]
transport-async-rw = [
    "tokio/io-util",
    "tokio-util/codec",
]
transport-child-process = [
    "transport-async-rw",
    "tokio/process",
    "dep:process-wrap",
]
transport-io = [
    "transport-async-rw",
    "tokio/io-std",
]
transport-streamable-http-client = [
    "client-side-sse",
    "transport-worker",
]
transport-streamable-http-client-reqwest = [
    "transport-streamable-http-client",
    "__reqwest",
]
transport-streamable-http-server = [
    "transport-streamable-http-server-session",
    "server-side-http",
    "transport-worker",
]
transport-streamable-http-server-session = [
    "transport-async-rw",
    "dep:async-trait",
    "dep:tokio-stream",
]
transport-worker = ["dep:tokio-stream"]

[lib]
name = "mcp_protocol"
path = "src/lib.rs"
doctest = false

[[test]]
name = "modern_lifecycle"
path = "tests/modern_lifecycle.rs"
required-features = [
    "client",
    "server",
]

[dependencies.async-trait]
version = "0.1.89"
optional = true

[dependencies.base64]
version = "0.23"
optional = true

[dependencies.bytes]
version = "1"
optional = true

[dependencies.futures]
version = "0.3"

[dependencies.http]
version = "1"
optional = true

[dependencies.http-body]
version = "1"
optional = true

[dependencies.http-body-util]
version = "0.1"
optional = true

[dependencies.indexmap]
version = "2"
features = ["serde"]

[dependencies.pastey]
version = "0.2.0"
optional = true

[dependencies.pin-project-lite]
version = "0.2"

[dependencies.process-wrap]
version = "10.0"
features = ["tokio1"]
optional = true

[dependencies.rand]
version = "0.10"
optional = true

[dependencies.reqwest]
version = "0.13.2"
features = [
    "json",
    "stream",
]
optional = true
default-features = false

[dependencies.schemars]
version = "1.0"
features = ["chrono04"]
optional = true

[dependencies.serde]
version = "1.0"
features = [
    "derive",
    "rc",
]

[dependencies.serde_json]
version = "1.0"

[dependencies.sse-stream]
version = "0.2.4"
optional = true

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = [
    "sync",
    "macros",
    "rt",
    "time",
]

[dependencies.tokio-stream]
version = "0.1"
optional = true

[dependencies.tokio-util]
version = "0.7"

[dependencies.tower-service]
version = "0.3"
optional = true

[dependencies.tracing]
version = "0.1"

[dependencies.url]
version = "2.4"
optional = true

[dependencies.uuid]
version = "1"
features = ["v4"]
optional = true

[dev-dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt",
    "io-util",
    "test-util",
]

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies.chrono]
version = "0.4.38"
features = [
    "serde",
    "clock",
    "std",
    "oldtime",
]
default-features = false

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies.chrono]
version = "0.4.38"
features = [
    "serde",
    "now",
]
default-features = false

[lints.rust]
unsafe_code = "forbid"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ['cfg(feature, values("auth", "auth-client-credentials-jwt", "auth-enterprise-managed", "local", "macros", "request-state", "reqwest-native-tls", "reqwest-tls-no-provider", "transport-streamable-http-client-unix-socket", "which-command"))']
