version: 1
review:
  include: ["crates/**/*.rs", "docs/**/*.md", "schemas/**/*.json", ".github/workflows/*.yml", ".vero.yaml", "Cargo.toml", "Cargo.lock", "README.md", "web/src/**/*.vue", "web/src/**/*.js", "web/src/**/*.css", "web/index.html", "web/package.json", "web/package-lock.json", "web/e2e/**/*.js", "web/playwright.config.js", "web/vite.config.js"]
  exclude: ["**/generated/**", "**/node_modules/**", "vendor/**", "web/dist/**", "target/**"]
  max_context_file_bytes: 1048576
  max_context_bytes: 600000
providers:
  codex:
    kind: codex_cli
    egress: network
    executable: codex
    env_allowlist: [PATH, HOME, CODEX_HOME]
reviewers:
  correctness:
    provider: codex
    instructions_file: .vero/reviewers/correctness.md
    include:
      - crates/vero-application/src/lib.rs
      - crates/vero-application/Cargo.toml
  correctness-core:
    provider: codex
    instructions_file: .vero/reviewers/correctness.md
    include:
      - crates/vero-core/src/lib.rs
  cli-contract:
    provider: codex
    instructions_file: .vero/reviewers/cli.md
    include:
      - crates/vero-cli/src/main.rs
  cli-surface:
    provider: codex
    instructions_file: .vero/reviewers/cli.md
    include:
      - README.md
      - crates/vero-cli/src/mcp.rs
      - schemas/gate-decision-v1.schema.json
      - schemas/review-output-v2.schema.json
  cli-acceptance:
    provider: codex
    instructions_file: .vero/reviewers/cli.md
    include:
      - crates/vero-cli/tests/cli.rs
      - docs/competitive-gap-plan.md
  local-ui:
    provider: codex
    instructions_file: .vero/reviewers/ui.md
    include:
      - .gitignore
      - .vero.yaml
      - Cargo.toml
      - crates/vero-http/**
      - web/src/**
      - web/index.html
      - web/package.json
      - web/package-lock.json
      - web/e2e/**
      - web/playwright.config.js
      - web/vite.config.js
      - scripts/ui-smoke.py
verification: {}
policy:
  required_reviewers: [correctness, correctness-core, cli-contract, cli-surface, cli-acceptance, local-ui]
  required_verifications: []
  block_severities: [critical, high]
  minimum_confidence: 80
  on_incomplete: block
