[workspace]
resolver = "2"
members = ["crates/vee-core", "crates/vee-store-sqlite", "crates/vee-process", "crates/vee-application", "crates/vee-git", "crates/vee-hosting", "crates/vee-http", "crates/vee-present", "crates/vee-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/klarlabs-studio/vee"

[workspace.dependencies]
anyhow = "1"
anstream = "1"
anstyle = "1"
axum = { version = "0.8", features = ["json"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ring = "0.17.14"
hmac = "0.12"
base64 = "0.22"
libc = "0.2"
tempfile = "3"
toml = "0.8"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_yaml = "0.9"
globset = "0.4"
semver = "1"
schemars = "=1.2.3"
jsonschema = "=0.59.0"
klarlabs-mcp = { version = "=0.1.0", default-features = false, features = ["stdio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "io-std", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
roxmltree = "=0.21.2"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
url = "=2.5.9"

[patch.crates-io]
# Keep the published klarlabs-mcp API while enabling its legacy initialize
# lifecycle for clients that have not adopted MCP's 2026 discovery lifecycle.
klarlabs-mcp = { path = "vendor/klarlabs-mcp" }
klarlabs-mcp-protocol = { path = "vendor/klarlabs-mcp-protocol" }
