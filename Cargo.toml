[workspace]
resolver = "2"
members = ["crates/vero-core", "crates/vero-application", "crates/vero-git", "crates/vero-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_yaml = "0.9"
schemars = "=1.2.3"
klarlabs-mcp = { version = "=0.1.0", default-features = false, features = ["stdio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "io-std"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
url = "=2.5.8"
libc = "0.2"
